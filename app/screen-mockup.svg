<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- phone frame -->
  <rect x="0" y="0" width="360" height="720" rx="28" fill="#0f172a"/>
  <rect x="10" y="10" width="340" height="700" rx="20" fill="#f8fafc"/>

  <!-- title -->
  <text x="180" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Vision Guard</text>

  <!-- connection row -->
  <text x="28" y="92" font-size="15" font-weight="700" fill="#334155">Cane:</text>
  <text x="78" y="92" font-size="15" font-weight="700" fill="#16a34a">Connected</text>
  <rect x="196" y="76" width="80" height="30" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="236" y="96" text-anchor="middle" font-size="13" fill="#334155">Connect</text>
  <rect x="284" y="76" width="48" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="308" y="96" text-anchor="middle" font-size="11" fill="#94a3b8">Discon.</text>

  <!-- alert status panel (CLEAR) -->
  <rect x="28" y="120" width="304" height="180" rx="14" fill="#16a34a"/>
  <text x="180" y="228" text-anchor="middle" font-size="60" font-weight="800" fill="#ffffff">CLEAR</text>

  <!-- live distance -->
  <text x="180" y="342" text-anchor="middle" font-size="15" fill="#64748b">Live distance</text>
  <text x="180" y="392" text-anchor="middle" font-size="44" font-weight="700" fill="#0f172a">247 cm</text>

  <!-- location -->
  <text x="180" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Location</text>
  <text x="180" y="464" text-anchor="middle" font-size="14" fill="#475569">Lat 19.076090  Lng 72.877420</text>

  <!-- SOS button -->
  <rect x="28" y="490" width="304" height="90" rx="14" fill="#dc2626"/>
  <text x="180" y="545" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">SOS — send my location</text>

  <!-- settings -->
  <text x="28" y="612" font-size="13" fill="#64748b">Family contact number</text>
  <rect x="28" y="620" width="230" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="642" font-size="13" fill="#334155">+91 98123 45678</text>
  <rect x="266" y="620" width="66" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="299" y="642" text-anchor="middle" font-size="12" fill="#334155">Save</text>

  <text x="28" y="686" font-size="13" fill="#475569">Demo mode (no hardware)</text>
  <rect x="286" y="674" width="46" height="22" rx="11" fill="#94a3b8"/>
  <circle cx="297" cy="685" r="9" fill="#ffffff"/>
</svg>
